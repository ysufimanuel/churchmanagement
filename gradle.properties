org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Supabase (publishable/anon key ONLY; never put a service-role key here) ---
# Override per developer in ~/.gradle/gradle.properties or via -P flags / CI secrets.
SUPABASE_URL=
SUPABASE_ANON_KEY=
# Base URL of the web app (used for the "Register church" link and optional username resolver)
WEB_BASE_URL=https://getchurchly.vercel.app
# Optional trusted endpoint that resolves username -> email (see docs/BACKEND_INTEGRATION_AUDIT.md). Leave blank to disable.
LOGIN_RESOLVER_URL=
